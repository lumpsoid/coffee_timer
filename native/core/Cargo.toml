[package]
name = "coffee_timer_core"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[features]
# Test doubles for the infrastructure traits (`fakes` module). Off in
# production builds; integration tests turn it on via the dev-dependency below.
test-fakes = []

[dev-dependencies]
coffee_timer_core = { path = ".", features = ["test-fakes"] }
